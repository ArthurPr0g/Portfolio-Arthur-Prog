<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08080a" />
    <title>Página não encontrada | Prog Soluções</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Página de erro servida pela Vercel para endereços que não existem (status 404).
         Fica fora do React: leve, sem loader, e não entra no sitemap. -->
    <style>
      @font-face { font-family: "Sora"; font-weight: 100 800; font-display: swap; src: url(/fonts/sora-latin.woff2) format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 300 700; font-display: swap; src: url(/fonts/dm-sans-latin.woff2) format("woff2"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #08080a; color: #f4f5f7; }
      body { font-family: "DM Sans", system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 32px 20px; }
      main { max-width: 520px; text-align: center; }
      .code { font-family: "Sora", sans-serif; font-size: clamp(4rem, 18vw, 7rem); font-weight: 700; line-height: 1; margin: 0; color: #81aaf7; }
      h1 { font-family: "Sora", sans-serif; font-size: 1.5rem; margin: 18px 0 8px; }
      p { color: #a3a8b2; line-height: 1.55; margin: 0 0 4px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 999px; border: 1px solid #2a2d35; color: #f4f5f7; text-decoration: none; font-weight: 600; }
      a.principal { background: #f4f5f7; color: #08080a; border-color: #f4f5f7; }
      a:hover, a:focus-visible { border-color: #81aaf7; outline: none; }
      a:focus-visible { box-shadow: 0 0 0 3px #81aaf7; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado ou não existe mais.</p>
      <p lang="en">This page could not be found.</p>
      <nav aria-label="Voltar ao site">
        <a class="principal" href="/pt">Ir para o início</a>
        <a href="/pt#contato">Falar com a gente</a>
        <a href="/en" lang="en">English</a>
        <a href="/pt-pt">Portugal</a>
      </nav>
    </main>
  </body>
</html>
